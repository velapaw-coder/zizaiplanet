# 自在星球 · Cloudflare Workers (vinext)
# Local `wrangler dev` / vite uses this file directly.
# Replace placeholder ids before the first real deploy. See README.
name = "zizai-planet"
main = "vinext/server/fetch-handler"
compatibility_date = "2026-10-24"
compatibility_flags = [ "nodejs_compat" ]

[assets]
directory = "dist/client"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "none"
run_worker_first = [ "/*", "!/_next/static/*", "!/*/_next/static/*" ]

# Create with: npx wrangler d1 create zizai-planet
# Then paste the real database_id here. The placeholder is enough for --local.
[[d1_databases]]
binding = "DB"
database_name = "zizai-planet"
database_id = "5301c04e-2d25-45bf-a359-adb9a4396bc2"
migrations_dir = "migrations"

# Create with: npx wrangler kv namespace create SESSION
[[kv_namespaces]]
binding = "SESSION"
id = "1d2d2daa9d234a7a8e741f70d57563dd"
preview_id = "dd0bffa4bb054d69830ff7e66e1fc855"

# Create with: npx wrangler r2 bucket create zizai-media
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "zizai-media"

[vars]
APP_URL = "https://www.zizaiplanet.com"
# Comma-separated. These emails become 运营管理员 on login.
ADMIN_EMAILS = "admin@zizaiplanet.com"
# Production: set this to "false" and send mail via MAIL_WEBHOOK_URL.
# Local override lives in .dev.vars (gitignored) as MAGIC_LINK_PREVIEW=true.
MAGIC_LINK_PREVIEW = "true"
# Dev-only default. Override in production: npx wrangler secret put SESSION_SECRET
# SESSION_SECRET is set via `wrangler secret put` (not in vars)
